name: Bug report
description: Report reproducible processor or documentation behavior.
body:
  - type: markdown
    attributes:
      value: "Use synthetic data. Do not include secrets or real payment/customer data. Report vulnerabilities privately through the Security tab. English and Spanish are welcome."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, Python/Docker version, database, and sandbox/live context (no credentials).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
